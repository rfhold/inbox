[package]
name = "inbox-server"
version = "0.2.2"
edition = "2024"
[dependencies]
mcp = { git = "https://git.holdenitdown.net/rfhold/waltr.git", rev = "d7a2527db2b0b85b2b382527f24d779bb522d8e9", default-features = false, features = ["oauth-authorization-server-postgres", "oauth-resource-owner-oidc-postgres"] }
getrandom = "0.3"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls", "stream"] }
url = "2"
hmac = "0.12"
tokio-util = "0.7"
axum = "0.8"
http-body = "1"
async-nats = "=0.46.0"
futures-util = "0.3"
tokio-stream = "0.1"
base64 = "0.22"
bincode = "1.3"
chrono = { version = "0.4", features = ["serde"] }
mail-builder = "0.4"
mail-parser = "0.11"
mailin = "0.6"
opentelemetry = "0.31"
opentelemetry_sdk = "0.31"
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls", "trace", "logs"] }
opentelemetry-appender-tracing = "0.31"
prost = "0.14"
rust-s3 = { version = "0.37", default-features = false, features = ["tokio-rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
tokio = { version = "1", features = ["full"] }
tonic = "0.14"
tonic-prost = "0.14"
tonic-web = "0.14"
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-opentelemetry = "0.32"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[dev-dependencies]
opentelemetry-proto = { version="0.31", default-features=false, features=["gen-tonic-messages","trace","logs"] }

[[test]]
name = "durable"
path = "../../tests/backend/durable.rs"

[[test]]
name = "arrivals"
path = "../../tests/backend/arrivals.rs"

[[test]]
name = "mcp"
path = "../../tests/backend/mcp.rs"

[[test]]
name = "domains"
path = "../../tests/backend/domains.rs"

[[test]]
name = "auth"
path = "../../tests/backend/auth.rs"
