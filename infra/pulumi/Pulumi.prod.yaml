config:
  kubernetes:enableSecretMutable: "true"
  kubernetes:context: pantheon
  inbox:namespace: inbox
  inbox:hostname: inbox.holdenitdown.net
  inbox:displayName: Inbox
  inbox:slug: inbox
  inbox:s3Endpoint: https://s3.pantheon.holdenitdown.net
  inbox:backupEndpoint: https://s3.pantheon.holdenitdown.net
